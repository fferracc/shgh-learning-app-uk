// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

// Build output lives OUTSIDE OneDrive (added 2026-09-24). OneDrive syncing
// android/app/build locked files mid-build ("Failed to clean up stale outputs"),
// and it was uploading hundreds of MB of throwaway build files. The APK now lands in
//   %LOCALAPPDATA%\SHGH-builds\uk-app\app\outputs\apk\debug\app-debug.apk
// publish_update.ps1 copies it back into the project folder.
def shghBuildRoot = System.getenv("LOCALAPPDATA") ? new File(System.getenv("LOCALAPPDATA"), "SHGH-builds/uk-app") : null

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    if (shghBuildRoot != null) {
        layout.buildDirectory.set(new File(shghBuildRoot, project.name))
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

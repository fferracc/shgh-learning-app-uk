                    return [
                         sanitize(s.name), sanitize(s.age), sanitize(s.email), sanitize(s.ethnicity), sanitize(s.nationality),

        // --- Student Edit Modal ---
        async function openEditStudentModal(button) {
            const studentId = button.dataset.studentId;
            try {
                const sDoc = await getDoc(doc(db, "students", studentId));
                if (!sDoc.exists()) { showNotification("Student not found", "Error"); return; }
                const showPrivate = canSeeStudentPrivate();
                const s = overlayStudentPrivate(sDoc.data(), await loadStudentPrivateDoc(studentId));
                const modal = document.getElementById('notificationModal');
                modal.innerHTML = `
                    <div class="bg-white rounded-lg p-6 shadow-xl w-full max-w-md">
                        <h3 class="text-lg font-bold mb-4">Edit Student</h3>
                        <form id="editStudentForm" class="space-y-3">
                            <input type="hidden" name="id" value="${escHtml(studentId)}">
                            <input type="text" name="name" value="${escHtml(s.name||'')}" placeholder="Name" class="w-full p-2 border rounded">
                            <input type="number" name="age" value="${escHtml(s.age||'')}" placeholder="Age" class="w-full p-2 border rounded">
                            <input type="email" name="email" value="${escHtml(s.email||'')}" placeholder="Email" class="w-full p-2 border rounded">
                            ${showPrivate ? `<input type="text" name="ethnicity" value="${escHtml(s.ethnicity||'')}" placeholder="Ethnicity" class="w-full p-2 border rounded">
                            <input type="text" name="nationality" value="${escHtml(s.nationality||'')}" placeholder="Nationality" class="w-full p-2 border rounded">` : ''}
                            <input type="text" name="postcode" value="${escHtml(s.postcode||'')}" placeholder="Postcode" class="w-full p-2 border rounded">
                            <input type="text" name="reason" value="${escHtml(s.reason||'')}" placeholder="Reason for Joining" class="w-full p-2 border rounded">
                            <div class="flex justify-end space-x-2 pt-2">
                                <button data-action="closeModal" type="button" class="px-4 py-2 bg-gray-300 rounded">Cancel</button>
                                <button data-action="saveEditedStudent" data-student-id="${escHtml(studentId)}" type="button" class="px-4 py-2 bg-green-600 text-white rounded">Save</button>
                            </div>
                        </form>
                    </div>`;
                modal.classList.remove('hidden');
            } catch(e) {
                console.error("Error loading student", e);
                showNotification("Could not load student.", "Error");
            }
        }

        async function saveEditedStudent(button) {
            const studentId = button.dataset.studentId;
            const form = document.getElementById('editStudentForm');
            if (!form) return;
            const data = Object.fromEntries(new FormData(form).entries());
            try {
                await updateDoc(doc(db, "students", studentId), withoutStudentPrivate(data));
                if (canSeeStudentPrivate()) await saveStudentPrivate(studentId, data);
                showNotification("Student updated successfully", "Success");
                actions.closeModal();
                // Optionally refresh student list screen if open
            } catch(e) {
                console.error("Error updating student", e);
                showNotification("Failed to update student", "Error");
            }
        }

        async function saveStudentEdits(button) {
            const studentId = button.dataset.studentId;
            const container = document.getElementById('studentDetailForm');
            if (!container) return;
            const inputs = container.querySelectorAll('input[data-key], select[data-key], textarea[data-key]');
            const data = {};
            inputs.forEach(input => {
                const key = input.dataset.key;
                if(input.type === 'number') {
                    data[key] = Number(input.value);
                } else if(input.tagName.toLowerCase() === 'select' && (input.value === 'true' || input.value === 'false')) {
                    data[key] = input.value === 'true';
                } else {
                    data[key] = input.value;
                }
            });
            try {
                await updateDoc(doc(db, "students", studentId), withoutStudentPrivate(data));
                if (canSeeStudentPrivate()) await saveStudentPrivate(studentId, data);
                showNotification("Student updated successfully", "Success");
            } catch(e) {
                console.error("Error updating student details", e);
                showNotification("Failed to update student", "Error");
            }
        }

        async function addCustomField(button) {
            const studentId = button.dataset.studentId;
            const input = document.getElementById('new_custom_field');
            if (!input) return;
            const key = input.value.trim();
            if (!key) return;
            try {
                await updateDoc(doc(db, "students", studentId), { [key]: "" });
                input.value = "";
                showNotification("Field added", "Success");
                // Re-render
                renderStudentDetailScreen(document.getElementById('app'), { studentId });
            } catch(e) {
                console.error("Error adding custom field", e);
                showNotification("Failed to add field", "Error");
            }
        }

            saveTableRow: t => saveTableRow(t),

            exportAllUserData,
            copyExportData: t => {

                textarea.setSelectionRange(0, 99999);

                    document.execCommand('copy');

                } catch (err) {
                    console.error('Copy to clipboard failed:', err);
                    showNotification('Failed to copy text. Please copy it manually.', 'Error');
                }
            },
            sendWhatsappReminder: t => {
                const student = JSON.parse(t.dataset.student);
                const course = JSON.parse(t.dataset.course);
                const phone = ukWhatsappNumber(student.parentPhone);
                if (!phone) { showNotification("This parent's phone number is missing or not a valid number.", "Error"); return; }
                const message = `Hi ${student.parentName || ''}, just a friendly reminder that ${student.name}'s online class for "${course.name}" starts in 15 minutes. Please help them get ready to connect!`;
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
            },
            sendWhatsappAbsence: t => {
                const student = JSON.parse(t.dataset.student);
                const course = JSON.parse(t.dataset.course);
                const phone = ukWhatsappNumber(student.parentPhone);
                if (!phone) { showNotification("This parent's phone number is missing or not a valid number.", "Error"); return; }
                const classDay = ukLongDate(t.dataset.date || londonToday());
                const message = `Hi ${student.parentName || ''}, we noticed ${student.name} was absent from the "${course.name}" class on ${classDay}. We hope everything is okay. Please let us know the reason for their absence when you have a moment.`;
                window.open(`https://wa.me/${phone}?text=${encodeURIComponent(message)}`, '_blank');
            },

                 if (gblCurrentUser.role !== 'super_admin') { showNotification("Only the super admin can reset a register.", "Not allowed"); return; }
                 const courseId = t.dataset.courseId;
                 showPrompt("Reset Attendance", "Enter the date to reset attendance for (YYYY-MM-DD).", "date", (date) => {
                     if (date) {
                        showConfirmation(`<b>This wipes the whole register for ${escHtml(ukLongDate(date))}.</b><br><br>Every tick for every student and teacher on that day is removed, and the hours and badges worked out from it change. It cannot be undone.<br><br>To fix one person, open the register and change the tick instead.`, () => {
                             handleResetAttendance(courseId, date);
                        }, "Wipe the register");
                     }
                });
            },
            resetTodaysAttendance: t => {
                 if (gblCurrentUser.role !== 'super_admin') { showNotification("Only the super admin can reset a register.", "Not allowed"); return; }
                 const courseId = t.dataset.courseId;
                 const todayStr = t.dataset.date || londonToday();
                showConfirmation(`<b>This wipes the whole register for ${escHtml(ukLongDate(todayStr))}.</b><br><br>Every tick for every student and teacher on that day is removed. It cannot be undone.<br><br>To fix one person, change their tick and press Save changes instead.`, () => {
                    handleResetAttendance(courseId, todayStr);
                }, "Wipe the register");
            },
            noClassToday: () => showConfirmation("No class today: nothing will be recorded.", () => goBack(), "OK"),
            viewResourceContent: t => showNotification(escHtml(unescape(t.dataset.content || '')).replace(/\n/g, '<br>'), "Resource Content"),
            openPolicyDoc: t => openPolicyDoc(t),
            openAnnouncement: t => openAnnouncement(t),
            showAllAnnouncements: () => showAllAnnouncements(),
             closeModal: () => {
                document.getElementById('notificationModal').classList.add('hidden');
                confirmationCallback = null;
             },
            confirmAction: () => {
                const cb = confirmationCallback;
                actions.closeModal();
                if (typeof cb === 'function') cb();
            },
            confirmPrompt: () => {
                const cb = confirmationCallback;
                const input = document.getElementById('promptInput');
                const value = input ? input.value : '';
                actions.closeModal();
                if (typeof cb === 'function') cb(value);
            },
        
            openAssignStudentModal: t => openAssignStudentModal(t),
            editCourse: t => editCourse(t),
            assignStudentToCourse: t => assignStudentToCourse(t.dataset.courseId, t.dataset.studentId),
            confirmAssignStudent: t => confirmAssignStudent(t),
            openEditStudentModal: t => openEditStudentModal(t),

};
        function setupEventListeners() {
            document.getElementById('appContainer').addEventListener('click', e => {
                const target = e.target.closest('[data-action]');
                if (target && actions[target.dataset.action]) { 
                    e.preventDefault(); 
                     actions[target.dataset.action](target); 
                }
            });
            document.getElementById('appContainer').addEventListener('change', e => {
                if (e.target && e.target.id === 'photoInput') {
                    handlePhotoUpload(e);
                }
            });
            document.getElementById('notificationModal').addEventListener('click', e => {
                const target = e.target.closest('[data-action]');
                if (target && actions[target.dataset.action]) { actions[target.dataset.action](target); }
            });
        }
        function setupGlobalListeners() {
            if (globalUnsubscribe.directChats) globalUnsubscribe.directChats();
            if (globalUnsubscribe.groupChat) globalUnsubscribe.groupChat();
            let hasUnreadDMs = false;
            let hasUnreadGroup = false;
            const updateMainChatDot = () => {
                const chatButton = document.getElementById('main-chat-button');
                if (!chatButton) return;
                const hasUnread = hasUnreadDMs || hasUnreadGroup;
                let dot = chatButton.querySelector('.notification-dot');
                if (hasUnread && !dot) {
                    dot = document.createElement('div');
                    dot.className = 'notification-dot';
                    chatButton.appendChild(dot);
                } else if (!hasUnread && dot) {
                    dot.remove();
                }
            };
            const directChatsQuery = query(collection(db, "chatSessions"), where("participants", "array-contains", gblCurrentUser.id));
            globalUnsubscribe.directChats = onSnapshot(directChatsQuery, (snapshot) => {
                const userLastReadMap = gblCurrentUser.chatLastRead || {};
                hasUnreadDMs = false; // Reset on each update
                snapshot.forEach(doc => {
                    const session = doc.data();
                     if (doc.id === 'group') return;
                    const lastRead = userLastReadMap[doc.id];
                    if (session.lastMessageAt && session.lastMessageSenderId !== gblCurrentUser.id && (!lastRead || session.lastMessageAt.toMillis() > lastRead.toMillis())) {
                         hasUnreadDMs = true;
                    }
                });
                updateMainChatDot();
            }, (error) => {
                console.error("Error in direct chat listener:", error);
             });
            const groupChatRef = doc(db, "chatSessions", "group");
            globalUnsubscribe.groupChat = onSnapshot(groupChatRef, (doc) => {
                const userLastReadMap = gblCurrentUser.chatLastRead || {};
                hasUnreadGroup = false;
                if (doc.exists()) {
                    const session = doc.data();
                     const lastRead = userLastReadMap['group'];
                    if (session.lastMessageAt && session.lastMessageSenderId !== gblCurrentUser.id && (!lastRead || session.lastMessageAt.toMillis() > lastRead.toMillis())) {
                        hasUnreadGroup = true;
                    }
                 }
                updateMainChatDot();
            }, (error) => {
                console.error("Error in group chat listener:", error);
            });
        }
        onAuthStateChanged(auth, async (user) => {
                if (user) {
                    const userDocRef = doc(db, "users", user.uid);
                    const userDocSnap = await getDoc(userDocRef);
                     if (userDocSnap.exists()) {
                        gblCurrentUser = { ...userDocSnap.data(), id: user.uid };
                        const mainApp = document.getElementById('mainAppInterface');
                        mainApp.classList.remove('hidden'); mainApp.classList.add('flex');
                         document.getElementById('loginScreen').classList.add('hidden');
                        
                        setupGlobalListeners();
                        // Tell the portal which app version this person runs (1 Oct 2026), so the
                        // users read rule can be tightened once every phone is up to date.
                        setDoc(doc(db, "appSeen", user.uid), {
                            version: APP_BUNDLE_VERSION,
                            platform: AppUpdater ? 'app' : 'web',
                            at: serverTimestamp()
                        }).catch(e => console.warn('[appSeen]', e && e.code));
                        // Badges are awarded by the server (badgesOnAttendance / badgesOnHoursApproved)
                        // the moment attendance is saved or hours are approved.
                        let homeScreenId, homeTitle;
                        switch(gblCurrentUser.role) {
                             case 'super_admin':
                                 homeScreenId = 'superAdminHomeScreen';
                                 homeTitle = 'Super Admin';
                                 break;
                            case 'admin':
                                 // An admin whose app admin was switched off gets the teacher home.
                                 homeScreenId = isAppAdmin() ? 'adminHomeScreen' : 'homeScreen';
                                 homeTitle = isAppAdmin() ? 'Admin Menu' : 'Home';
                                 break;
                            default:
                                 // A granted app_admin (e.g. a project coordinator who still
                                 // teaches) lands on the admin menu, not the teacher home.
                                 if (hasPerm('app_admin')) {
                                     homeScreenId = 'adminHomeScreen';
                                     homeTitle = 'Admin Menu';
                                 } else {
                                     homeScreenId = 'homeScreen';
                                     homeTitle = 'Home';
                                 }
                        }
                        window.navigationStack = [];
                        navigateTo(homeScreenId, homeTitle);
                    } else { 
                        showNotification(`Your user profile was not found in the database. Please contact an administrator.`);
                        setTimeout(() => handleLogout({ force: true }), 5000); // let the message be read first
                    }
                } else {
                    gblCurrentUser = null;
                    gblSuperAdminOriginalState = null;
                    const mainApp = document.getElementById('mainAppInterface');
                    mainApp.classList.add('hidden'); mainApp.classList.remove('flex');
                    document.querySelectorAll('.app-screen').forEach(s => s.classList.add('hidden'));
                    document.getElementById('loginScreen').classList.remove('hidden');
                }
            });
            setupEventListeners(); 
            lucide.createIcons();
            // Everything above ran without an error: this bundle works (see IN-APP UPDATES).
            confirmBundleStarted();

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHGH Sessions App</title>
    <!-- 25 Sep 2026: everything loads from the app itself (vendor/), so the app works on a
         poor or missing connection. tailwind.css is compiled from the classes in this file:
         regenerate it after adding classes (see tw.config.js). safe-html.js cleans every
         piece of HTML before it goes on screen (see the comment inside it). -->
    <link rel="stylesheet" href="vendor/tailwind.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/safe-html.js"></script>
    <script src="vendor/lucide.min.js"></script>
    <!-- 2 Oct 2026: Chart.js and html2canvas were loaded on every start but never used, and the
         880 KB spreadsheet library now loads only when a spreadsheet is imported (loadScriptOnce). -->

    <style>
        body { font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; }
        /* 2 Oct 2026: on a phone the app fills the screen (it used to sit in a fixed
           384 x 800 px rounded "phone" box). The box stays on a computer screen. */
        @media (max-width: 640px) {
            body { padding: 0 !important; display: block !important; background: #fff !important; }
            #appContainer { max-width: none !important; width: 100% !important; height: 100vh !important; height: 100dvh !important; border-radius: 0 !important; box-shadow: none !important; }
        }
        #appHeader { padding-top: max(1rem, env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px)); gap: 0.5rem; }
        #appHeader > div:first-child { min-width: 0; flex: 1 1 auto; }
        #headerTitle { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
        #mainAppInterface, #loginScreen { padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px)); }
        .icon-btn { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; border-radius: 9999px; }
        .icon-btn.hidden { display: none; } /* 5 Oct 2026: the back arrow showed on the home screen */
        button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, [data-action]:focus-visible { outline: 3px solid #2563eb; outline-offset: 2px; }
        /* White text on these colours was hard to read (below the 4.5:1 contrast for text). */
        .text-white.bg-green-500, .text-white.bg-green-600 { background-color: #15803d; }
        .text-white.bg-blue-500 { background-color: #2563eb; }
        .text-white.bg-red-500 { background-color: #dc2626; }
        .text-white.bg-orange-500 { background-color: #c2410c; }
        .text-white.bg-yellow-500, .text-white.bg-yellow-600 { background-color: #a16207; }
        .text-white.bg-teal-600 { background-color: #0f766e; }
        .text-white.bg-emerald-600 { background-color: #047857; }
        .text-white.bg-gray-500 { background-color: #4b5563; }
        .text-xs.px-2.py-1, .text-xs.px-3.py-1 { min-height: 32px; }
        #offlineBanner { background: #92400e; color: #fff; font-size: 0.8rem; text-align: center; padding: 6px 8px; }
        .app-screen { padding: 1.5rem; height: 100%; overflow-y: auto; }
        .app-screen.p-0 { padding: 0; }
        .app-screen::-webkit-scrollbar { width: 4px; }
        .app-screen::-webkit-scrollbar-thumb { background-color: #9ca3af; border-radius: 20px; }
        .spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #16a34a; animation: spin 1s ease infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .detail-item input:disabled, .detail-item select:disabled, .detail-item textarea:disabled { border-color: transparent; background: transparent; padding-left: 0; }
        .detail-item { border-bottom: 1px solid #e5e7eb; padding-bottom: 0.5rem; margin-bottom: 0.5rem; }
        .detail-item label { font-size: 0.75rem; color: #6b7280; display: block; font-weight: 600; }
        .detail-item p, .detail-item input, .detail-item select, .detail-item textarea { font-size: 0.875rem; color: #111827; width: 100%; }
       .chat-message-container { display: flex; flex-direction: column; gap: 0.75rem; padding: 1rem; }
        .chat-message { max-width: 80%; padding: 0.5rem 0.75rem; border-radius: 1rem; }
       .chat-message.sent { background-color: #166534; color: white; align-self: flex-end; }
       .chat-message.received { background-color: #e5e7eb; color: #1f2937; align-self: flex-start; }
        .db-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
        .db-table th, .db-table td { border: 1px solid #ddd; padding: 8px; text-align: left; vertical-align: top; }
        .db-table th { white-space: nowrap;  background-color: #f2f2f2; }
        .db-table input, .db-table textarea, .db-table select { width: 100%; border: 1px solid #ccc; padding: 4px; border-radius: 4px; font-size: 0.75rem; }
        .db-table .actions-cell { width: 150px; text-align: right; }
        .db-table .actions-cell button { margin-left: 4px; }
        .checklist-item { display: flex; align-items: center; padding: 0.5rem; border-bottom: 1px solid #e5e7eb; }
       .notification-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 10px;
            height: 10px;
           background-color: #ef4444; /* red-500 */
            border-radius: 50%;
            border: 2px solid white;
        }
        
        /* Calendar Styles */
       .calendar-container { display: flex; flex-direction: column; height: 100%; }
       .calendar-header { display: grid; grid-template-columns: 50px repeat(7, 1fr); text-align: center; font-weight: 600; font-size: 0.8rem; background-color: #f9fafb; border-bottom: 1px solid #e5e7eb; padding: 0.5rem 0; position: sticky; top: 0; z-index: 10;}
       .calendar-scroll-container { flex-grow: 1; overflow-y: auto; }
        .calendar-body {
            display: grid;
            grid-template-columns: 50px repeat(7, 1fr);
            grid-auto-rows: 40px; /* Make row height shorter */
            background-image:
                linear-gradient(to right, #f3f4f6 1px, transparent 1px),
                linear-gradient(to bottom, #f3f4f6 1px, transparent 1px);
            background-size: calc((100% - 50px) / 7) 40px; /* Adjust background size */
            background-position: 50px 0;
        }
       .calendar-time-label {
           grid-column: 1;
           text-align: right;
           padding-right: 0.5rem;
            font-size: 0.7rem;
            color: #6b7280;
           line-height: 40px; /* Center time label vertically */
        }
       .calendar-time-label:nth-of-type(odd) {
            border-top: 1px solid #e5e7eb;
        }
        .calendar-event {
           grid-row-start: var(--start);
           grid-row-end: var(--end);
           grid-column-start: var(--col);
           background-color: #dcfce7;
           border-left: 4px solid #16a34a;
           border-radius: 4px;
            padding: 2px 6px; /* Adjust padding */
            font-size: 0.7rem;
            overflow: hidden;
            cursor: pointer;
            margin: 1px;
            color: #14532d;
            z-index: 1;
        }
    </style>
</head>
<body class="bg-gray-200 flex items-center justify-center min-h-screen p-4">

    <script type="module">
        // --- Firebase Imports ---
        import { initializeApp } from "./vendor/firebase/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "./vendor/firebase/firebase-auth.js";
        import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, terminate, clearIndexedDbPersistence, waitForPendingWrites, collection, doc, getDoc, getDocs, addDoc, updateDoc, deleteDoc, query, where, writeBatch, Timestamp, onSnapshot, orderBy, setDoc, limit, runTransaction, serverTimestamp } from "./vendor/firebase/firebase-firestore.js";
        import { getStorage, ref, uploadBytes, getDownloadURL } from "./vendor/firebase/firebase-storage.js";
        import { getFunctions, httpsCallable } from "./vendor/firebase/firebase-functions.js";
        // --- Firebase Initialization ---
        const firebaseConfig = {
            apiKey: "YOUR_FIREBASE_API_KEY",
            authDomain: "shgh-lms1.firebaseapp.com",
            projectId: "shgh-lms1",
            storageBucket: "shgh-lms1.appspot.com",
            messagingSenderId: "YOUR_SENDER_ID",
            appId: "YOUR_APP_ID"
        };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        // Offline (2 Oct 2026): Firestore keeps a copy of what this phone has read, and
        // the changes it makes, on the phone. A register taken with no signal is saved
        // here and uploads by itself when the signal comes back, even if the app was closed.
        // Signing out wipes that copy (handleLogout).
        let db;
        try {
            db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
        } catch (e) {
            console.warn('[offline] could not keep data on this device; online only', e);
            db = getFirestore(app);
        }
        const storage = getStorage(app);
        const functions = getFunctions(app); // region us-central1, where createStaffAccount lives

        // ================= IN-APP UPDATES (2026-09-24) =================
        // APP_BUNDLE_VERSION is rewritten by publish_update.ps1 on every release.
        // Do not edit it by hand.
        const APP_BUNDLE_VERSION = '2026.10.05.1352';
        const UPDATE_MANIFEST_URL = 'https://shgh-lms1.web.app/app-updates/uk/latest.json';

        // Only exists inside the Android app. On the web version this is null and
        // every function below quietly does nothing.
        // Calls the native plugin through the bridge's nativePromise, which Android injects
        // before any page script runs. NOT registerPlugin: that only exists once
        // @capacitor/core is loaded, which this app never does, so it was always null on
        // the phone and the updater silently never ran (caught on the emulator 24 Sep).
        function makeNativeUpdater() {
            const C = window.Capacitor;
            if (!C || typeof C.isNativePlatform !== 'function' || !C.isNativePlatform()) return null;
            if (typeof C.nativePromise !== 'function') return null;
            const call = (method, options) => C.nativePromise('CapacitorUpdater', method, options || {});
            return {
                notifyAppReady: () => call('notifyAppReady'),
                getBuiltinVersion: () => call('getBuiltinVersion'),
                list: (o) => call('list', o),
                download: (o) => call('download', o),
                set: (o) => call('set', o),
            };
        }
        const AppUpdater = makeNativeUpdater();

        // Tell the updater this bundle started correctly. Since 2 Oct 2026 this runs at the
        // END of this script, after every screen, button and listener has been set up, so a
        // bundle that breaks anywhere in its start-up is rolled back within 10 seconds
        // (before, it said "ready" on line one and a later failure was kept).
        console.log('[updater] running bundle ' + APP_BUNDLE_VERSION + (AppUpdater ? ' (app)' : ' (web)'));
        function confirmBundleStarted() {
            if (!AppUpdater) return;
            AppUpdater.notifyAppReady()
                .catch(e => console.warn('notifyAppReady failed', e))
                // A fresh start is always a safe moment: nobody is half-way through anything.
                .then(() => applyDownloadedUpdate('startup'));
        }
        // An APK may only ever be downloaded from our own hosting.
        const APK_URL_PREFIX = 'https://shgh-lms1.web.app/';
        function safeApkUrl(u) { return typeof u === 'string' && u.indexOf(APK_URL_PREFIX) === 0 && /\.apk(\?|$)/.test(u) ? u : null; }

        // Screens where reloading the app loses nothing. A register or a form is never one of them.
        function isSafeScreenForUpdate() {
            try { return ['loginScreen', 'homeScreen', 'adminHomeScreen', 'superAdminHomeScreen'].includes(currentScreen); }
            catch (e) { return false; }
        }

        // Bundle status: 'pending' = downloaded but not run yet, 'success' = has run fine,
        // 'error' = failed to start and was rolled back, so it is never tried again.
        // Install a version that has already been downloaded, but ONLY at a safe moment:
        // when the app starts, or when it comes back to a home or login screen.
        // Deliberately NOT the plugin's next(): that reloads the app the instant it goes to
        // the background, e.g. while a teacher has hopped to WhatsApp mid-register.
        async function applyDownloadedUpdate(reason) {
            if (!AppUpdater) return false;
            try {
                const res = await AppUpdater.list();
                const ready = (res && res.bundles || [])
                    .filter(b => (b.status === 'pending' || b.status === 'success') && compareVersions(b.version, APP_BUNDLE_VERSION) > 0)
                    .sort((a, b) => compareVersions(b.version, a.version))[0];
                if (!ready) return false;
                console.log('[updater] ' + ready.version + ' is downloaded; reason=' + reason + ' safeScreen=' + isSafeScreenForUpdate());
                if (reason === 'startup' || isSafeScreenForUpdate()) {
                    console.log('[updater] applying ' + ready.version);
                    await AppUpdater.set({ id: ready.id }); // reloads straight into the new version
                    return true;
                }
                showUpdateBar(`<b>Update ready.</b> It installs by itself when you are back on the home screen or next open the app.`, [
                    { label: 'Later', onClick: hideUpdateBar },
                    { label: 'Restart now', primary: true, onClick: () => AppUpdater.set({ id: ready.id }) },
                ]);
                return false;
            } catch (e) { console.warn('Could not apply the downloaded update:', e); return false; }
        }

        function compareVersions(a, b) {
            const pa = String(a || '0').split('.').map(n => parseInt(n, 10) || 0);
            const pb = String(b || '0').split('.').map(n => parseInt(n, 10) || 0);
            for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const d = (pa[i] || 0) - (pb[i] || 0);
                if (d) return d > 0 ? 1 : -1;
            }
            return 0;
        }

        function showUpdateBar(html, buttons) {
            let bar = document.getElementById('appUpdateBar');
            if (!bar) {
                bar = document.createElement('div');
                bar.id = 'appUpdateBar';
                bar.style.cssText = 'position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;background:#166534;color:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-size:14px;line-height:1.35';
                document.body.appendChild(bar);
            }
            bar.innerHTML = `<div>${html}</div>` + (buttons && buttons.length
                ? `<div style="margin-top:10px;display:flex;gap:8px;justify-content:flex-end">${buttons.map((b, i) =>
                    `<button data-upd="${escHtml(i)}" style="background:${escHtml(b.primary ? '#fff' : 'transparent')};color:${escHtml(b.primary ? '#166534' : '#fff')};border:1px solid #fff;border-radius:8px;padding:6px 12px;font-weight:600">${escHtml(b.label)}</button>`).join('')}</div>`
                : '');
            (buttons || []).forEach((b, i) => {
                const el = bar.querySelector(`[data-upd="${escHtml(i)}"]`);
                if (el) el.onclick = b.onClick;
            });
        }
        function hideUpdateBar() { const b = document.getElementById('appUpdateBar'); if (b) b.remove(); }

        let updateCheckRunning = false, lastUpdateCheck = 0;
        async function checkForAppUpdate() {
            if (!AppUpdater || updateCheckRunning) return;
            if (Date.now() - lastUpdateCheck < 30 * 60 * 1000) return; // at most every 30 minutes
            updateCheckRunning = true; lastUpdateCheck = Date.now();
            try {
                const res = await fetch(UPDATE_MANIFEST_URL + '?t=' + Date.now(), { cache: 'no-store' });
                if (!res.ok) return;
                const m = await res.json();

                // 1. A change to the native app itself (rare): Android requires one tap.
                const builtin = await AppUpdater.getBuiltinVersion().catch(() => ({ version: '0' }));
                const apkUrl = safeApkUrl(m.apkUrl);
                if (m.minNativeVersion && compareVersions(builtin.version, m.minNativeVersion) < 0 && apkUrl) {
                    showUpdateBar(`<b>A new version of the app needs installing.</b><br>Tap Download, then open the file and tap Update. If your phone says the app cannot be installed, uninstall the old app first and download again.`, [
                        { label: 'Later', onClick: hideUpdateBar },
                        { label: 'Download', primary: true, onClick: () => { window.location.href = apkUrl; } },
                    ]);
                    return;
                }
                // 1b. A newer app file is RECOMMENDED but not required (2 Oct 2026): offer it,
                // at most every 3 days after "Later". Fixed 5 Oct 2026: the normal update below
                // ALWAYS runs as well; the offer is only shown at the end (before, showing the
                // offer stopped every normal update until the person tapped Later).
                let apkOffer = null;
                if (m.recommendedNativeVersion && compareVersions(builtin.version, m.recommendedNativeVersion) < 0 && apkUrl) {
                    let snoozed = 0;
                    try { snoozed = Number(localStorage.getItem('apkOfferSnoozedAt') || 0); } catch (e) { }
                    if (Date.now() - snoozed > 3 * 24 * 3600 * 1000) {
                        apkOffer = () => showUpdateBar(`<b>A newer version of the app is ready to install.</b><br>It makes the app safer and adds the phone's Back button. Tap Download, then open the file and tap Update.`, [
                            { label: 'Later', onClick: () => { try { localStorage.setItem('apkOfferSnoozedAt', String(Date.now())); } catch (e) { } hideUpdateBar(); } },
                            { label: 'Download', primary: true, onClick: () => { window.location.href = apkUrl; } },
                        ]);
                    }
                }

                // 2. A normal update: downloaded in the background, installed automatically.
                const normalUpdate = async () => {
                    console.log('[updater] manifest says ' + m.version + ', running ' + APP_BUNDLE_VERSION + ', native ' + builtin.version);
                    if (!m.version || !m.url || compareVersions(m.version, APP_BUNDLE_VERSION) <= 0) return;
                    // Never install a bundle without its fingerprint (2 Oct 2026): the plugin checks the
                    // downloaded file against it, so a damaged or swapped file is refused.
                    if (!/^[0-9a-f]{64}$/.test(String(m.checksum || ''))) { console.warn('[updater] manifest has no valid checksum; not downloading'); return; }
                    if (String(m.url).indexOf('https://shgh-lms1.web.app/app-updates/uk/') !== 0) { console.warn('[updater] bundle url not on our hosting; not downloading'); return; }
                    if (!apkOffer) showUpdateBar(`<b>Updating the app...</b><br>Downloading version ${escHtml(m.version)}. You can keep working.`);
                    // Skip the download if this version is already on the phone, waiting.
                    const have = await AppUpdater.list().catch(() => ({ bundles: [] }));
                    const already = (have.bundles || []).find(b => b.version === m.version && (b.status === 'pending' || b.status === 'success'));
                    const bundle = already || await AppUpdater.download({ url: m.url, version: m.version, checksum: m.checksum });
                    console.log('[updater] ' + (already ? 'already had ' : 'downloaded ') + m.version + ' (status ' + bundle.status + ')');
                    if (apkOffer) return; // the downloaded version still installs by itself at the next safe moment
                    const notes = m.notes ? `<br><span style="opacity:.85">${escHtml(String(m.notes).replace(/[<>&]/g, ''))}</span>` : '';
                    showUpdateBar(`<b>Update ready.</b> It installs by itself when you are back on the home screen or next open the app.${notes}`, [
                        { label: 'Later', onClick: hideUpdateBar },
                        { label: 'Restart now', primary: true, onClick: () => AppUpdater.set({ id: bundle.id }) },
                    ]);
                };
                try { await normalUpdate(); }

                seen.add(e.badgeId);
                out.push({ badge: b, earned: e, day: badgeEarnedDay(e) });
            });
            return out.sort((a, b) => b.day.localeCompare(a.day));
        }
        // Fair attendance rate of each course (Intranet Portal/src/lib/attendanceRates.ts):
        // session dates = distinct dates with any record; each student counted once per date;
        // a student's span runs from their enrolment date (courseRoster.enrolledAt) or first
        // register to the latest register if still on the roster, else to their last register;
        // expected per date = max(students whose span covers it, present that date).
        // joinedFallback (studentId -> day) is used only for a roster student who never came
        // and has no enrolment date; without it such a student is not counted.
        function attendanceByCourse(records, roster, joinedFallback) {
            joinedFallback = joinedFallback || {};
            const dates = {}, presentByDate = {}, onRoster = {};
            (records || []).forEach(r => {
                if (!r || !r.courseId || !r.date) return;
                (dates[r.courseId] = dates[r.courseId] || new Set()).add(r.date);
                if (r.studentId) {
                    const byD = (presentByDate[r.courseId] = presentByDate[r.courseId] || {});
                    (byD[r.date] = byD[r.date] || new Set()).add(r.studentId);
                }
            });
            (roster || []).forEach(r => {
                if (!r || !r.courseId || !r.studentId) return;
                const m = (onRoster[r.courseId] = onRoster[r.courseId] || new Map());
                const enrolled = toDay(r.enrolledAt);
                const prev = m.get(r.studentId);
                m.set(r.studentId, prev && enrolled ? (prev < enrolled ? prev : enrolled) : (prev || enrolled));
            });
            const out = {};
            new Set([...Object.keys(dates), ...Object.keys(onRoster)]).forEach(cid => {
                const days = [...(dates[cid] || [])].sort();
                const byDate = presentByDate[cid] || {};
                const latest = days[days.length - 1];
                const spans = new Map();
                days.forEach(d => (byDate[d] || new Set()).forEach(sid => {
                    const sp = spans.get(sid);
                    if (!sp) spans.set(sid, { first: d, last: d });
                    else { if (d < sp.first) sp.first = d; if (d > sp.last) sp.last = d; }
                }));
                (onRoster[cid] || new Map()).forEach((enrolled, sid) => {
                    if (!latest) return;
                    const sp = spans.get(sid);
                    if (sp) { sp.last = latest; if (enrolled && enrolled < sp.first) sp.first = enrolled; }
                    else {
                        const joined = enrolled || joinedFallback[sid];
                        if (!joined) return;
                        const from = joined < days[0] ? days[0] : joined;
                        if (from <= latest) spans.set(sid, { first: from, last: latest });
                    }
                });
                let present = 0, expected = 0;
                days.forEach(d => {
                    const p = byDate[d] ? byDate[d].size : 0;
                    let inSpan = 0;
                    spans.forEach(sp => { if (sp.first <= d && d <= sp.last) inSpan++; });
                    present += p;
                    expected += Math.max(inSpan, p);
                });
                out[cid] = { sessions: days.length, present, expected, rate: expected > 0 ? Math.round((present / expected) * 100) : null };
            });
            return out;
        }
        // Headline: the AVERAGE of the course rates of the chosen courses (no rate = left out).
        function attendanceHeadline(perCourse, courseIds) {
            let sum = 0, n = 0, present = 0, expected = 0;
            new Set(courseIds).forEach(id => {
                const a = perCourse[id];
                if (!a || a.rate === null) return;
                sum += a.rate; n++; present += a.present; expected += a.expected;
            });
            return { rate: n > 0 ? Math.round(sum / n) : null, present, expected, courses: n };
        }

        let historyDepth = 0, ignoreNextPop = false;
        window.addEventListener('popstate', () => {
            if (ignoreNextPop) { ignoreNextPop = false; return; }
            // Entries left from before a sign-out or an update (the page reloaded): walk past
            // them, so Back on the first screen behaves normally (5 Oct 2026).
            if (window.navigationStack.length === 0 && historyDepth === 0) { try { history.back(); } catch (e) { } return; }
            historyDepth = Math.max(0, historyDepth - 1);

                if (window.navigationStack.length > historyDepth) { try { history.pushState({ shgh: Date.now() }, ''); historyDepth++; } catch (e) { } }
                return;

        function labelIconButtons(root) {

                    if (b.getAttribute('aria-label') || (b.textContent || '').trim()) return;
                    const name = b.getAttribute('title') || String(b.dataset.action || 'Button').replace(/([A-Z])/g, ' $1').toLowerCase();

        // --- COURSE HISTORY (2 Oct 2026): past registers and class reports on the course page ---
        // Same idea as the portal's historic register: every day with a register, read only
        // (the super admin can still open and change one). Class reports: everyone teaching
        // the course sees them; the author can edit their own on the day it was written.
        async function courseHistoryHtml(course) {
            try {
                const [attSnap, repSnap] = await Promise.all([
                    getDocs(query(collection(db, "attendanceRecords"), where("courseId", "==", course.id))),
                    getDocs(query(collection(db, "classRecords"), where("courseId", "==", course.id))),
                ]);
                const byDate = new Map();
                attSnap.forEach(d => {
                    const r = d.data(); if (!r.date) return;
                    if (!byDate.has(r.date)) byDate.set(r.date, { students: 0, teachers: 0 });
                    if (r.studentId) byDate.get(r.date).students++;
                    else if (r.userId) byDate.get(r.date).teachers++;
                });
                const dates = [...byDate.keys()].sort().reverse();
                const today = londonToday();
                const regRows = dates.slice(0, 30).map(day => {
                    const c = byDate.get(day);
                    const label = c.students + c.teachers === 0 ? 'Nobody came' : `${c.students} student${c.students === 1 ? '' : 's'}, ${c.teachers} teacher${c.teachers === 1 ? '' : 's'}`;
                    return `<li><button data-action="navigateTo" data-screen-id="attendanceScreen" data-screen-title="Register" data-context="${escHtml(JSON.stringify({ courseId: course.id, date: day }))}" class="w-full text-left py-2 border-b flex justify-between items-center gap-2"><span>${escHtml(ukLongDate(day))}${day === today ? ' <span class="text-xs text-green-700 font-semibold">(today)</span>' : ''}</span><span class="text-xs text-gray-600">${escHtml(label)}</span></button></li>`;
                }).join('');
                const reports = repSnap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => String(b.date || '').localeCompare(String(a.date || '')));
                const authorIds = [...new Set(reports.map(r => r.volunteerId).filter(Boolean))];
                const authors = await Promise.all(authorIds.map(id => getPersonDoc(id).catch(() => null)));
                const nameOf = {}; (authors || []).forEach(a => { if (a && a.exists && a.exists()) nameOf[a.id] = a.data().name || a.data().displayName; });
                const repRows = reports.slice(0, 20).map(r => {
                    const mayEdit = gblCurrentUser.role === 'super_admin' || (r.volunteerId === gblCurrentUser.id && r.date === today && !isFinishedCourseStatus(course.status));
                    return `<li class="py-2 border-b">
                        <div class="flex justify-between items-center gap-2"><span class="font-semibold text-sm">${escHtml(ukLongDate(r.date || ''))}</span>${mayEdit ? `<button data-action="navigateTo" data-screen-id="classReportScreen" data-screen-title="Edit Report" data-context="${escHtml(JSON.stringify({ courseId: course.id, reportId: r.id }))}" class="text-xs bg-yellow-600 text-white px-3 py-1 rounded-md">Edit</button>` : ''}</div>
                        <p class="text-xs text-gray-500">By ${escHtml(nameOf[r.volunteerId] || r.volunteerName || 'Unknown')}</p>
                        ${r.topicsCovered ? `<p class="text-sm text-gray-700 mt-1"><span class="font-semibold">Topics:</span> ${escHtml(r.topicsCovered)}</p>` : ''}
                        ${r.studentProgress ? `<p class="text-sm text-gray-700"><span class="font-semibold">Progress:</span> ${escHtml(r.studentProgress)}</p>` : ''}
                        ${r.issues ? `<p class="text-sm text-red-700"><span class="font-semibold">Issues:</span> ${escHtml(r.issues)}</p>` : ''}
                    </li>`;
                }).join('');
                return `<div class="p-4 bg-white rounded-lg shadow">
                        <h3 class="font-bold text-lg mb-1">Registers</h3>
                        ${regRows ? `<ul>${regRows}</ul>${dates.length > 30 ? `<p class="text-xs text-gray-500 mt-2">Showing the latest 30 of ${dates.length} days.</p>` : ''}` : '<p class="text-sm text-gray-500">No registers yet.</p>'}
                    </div>
                    <div class="p-4 bg-white rounded-lg shadow">
                        <h3 class="font-bold text-lg mb-1">Class Reports</h3>
                        ${repRows ? `<ul>${repRows}</ul>` : '<p class="text-sm text-gray-500">No class reports yet.</p>'}
                    </div>`;
            } catch (e) {
                console.error('course history', e);
                return `<div class="p-4 bg-white rounded-lg shadow"><p class="text-sm text-red-600">Could not load this course's registers and reports.</p></div>`;
            }
        }

        async function saveOneToOneSession(button) {
            const form = document.getElementById('logSessionForm');
            if (!form) return;
            const courseId = form.dataset.courseId;
            const sel = form.querySelector('#sessionStudent');
            const data = {
                courseId,
                studentId: sel.value,
                studentName: sel.options[sel.selectedIndex] ? sel.options[sel.selectedIndex].text : '',
                volunteerId: gblCurrentUser.id,
                volunteerName: gblCurrentUser.name || gblCurrentUser.displayName || '',
                date: form.querySelector('#sessionDate').value,
                durationMinutes: Number(form.querySelector('#sessionDuration').value),
                topic: form.querySelector('#sessionTopic').value.trim(),
                notes: form.querySelector('#sessionNotes').value.trim(),
                followUp: form.querySelector('#sessionFollowUp').value.trim(),
                createdAt: Timestamp.now(),
            };
            if (!data.studentId) { showNotification("Add the person to this course first, then log the session.", "Error"); return; }
            if (!data.date || !data.topic) { showNotification("Please fill in the date and what help they asked for.", "Error"); return; }
            button.disabled = true;
            try {
                await addDoc(collection(db, "oneToOneSessions"), data);
                actions.closeModal();
                showNotification("Session saved.", "Success");

            } catch (e) {
                console.error("Could not save 1-2-1 session", e);
                showNotification("The session could not be saved. Please try again.", "Error");
                button.disabled = false;
            }
        }

        // ================= POLICY RULES (30 Sep 2026) =================
        // Same rules as the portal (Intranet Portal/src/lib/policies.ts):
        //   audience 'staff' | 'volunteers' | 'everyone' (missing = everyone);
        //   version is a whole number (missing = 1); a new version must be read again;
        //   staff, admins and the super admin read staff + everyone; volunteers read
        //   volunteers + everyone; a read counts when its version (missing = 1) is at least
        //   the policy's version; Mark as Read only after the document has been opened.
        // App reads go to readConfirmations {volunteerId, policyId, version, openedAt, readAt};
        // portal reads are in policy_tracking {userId, policyId, version, ...}. Both count.
        const POLICY_AUDIENCE_LABEL = { everyone: 'Everyone', staff: 'Staff', volunteers: 'Volunteers' };
        function policyAudienceOf(p) {
            const a = String((p && p.audience) || '').trim().toLowerCase();
            if (a === 'staff') return 'staff';
            if (a === 'volunteers' || a === 'volunteer') return 'volunteers';
            return 'everyone';
        }
        function policyVersionOf(p) {
            const v = p ? p.version : undefined;
            const n = typeof v === 'number' ? v : parseFloat(String(v == null ? '' : v));
            return Number.isFinite(n) && n >= 1 ? Math.floor(n) : 1;
        }
        function audienceGroupOf(role) {
            const r = String(role || '').trim().toLowerCase();
            if (r === 'staff' || r === 'admin' || r === 'super_admin') return 'staff';
            if (r === 'volunteer') return 'volunteers';
            return null;
        }
        function mustReadPolicy(p, role) {
            const g = audienceGroupOf(role);
            if (!g) return false;
            const a = policyAudienceOf(p);
            return a === 'everyone' || a === g;
        }
        // What the person sees in the library: their audience plus everyone.
        function policyVisibleTo(p, role) {
            const a = policyAudienceOf(p);
            return a === 'everyone' || audienceGroupOf(role) === a;
        }
        function policyReadCounts(readVersion, p) {
            return readVersion !== undefined && readVersion !== null && readVersion >= policyVersionOf(p);
        }
        function policyDayText(ts) {
            const d = toDay(ts);
            return d ? d.slice(8, 10) + '/' + d.slice(5, 7) + '/' + d.slice(0, 4) : '';
        }
        // Documents opened in this session: 'id:vN' -> ISO time.
        const policyOpenedAt = {};
        let policyDocCache = {};
        function policyCtaHtml(p, readVersion) {
            const version = policyVersionOf(p);
            if (policyReadCounts(readVersion, p)) return `<span class="text-sm px-3 py-1 rounded-md bg-gray-300 text-gray-600">Read</span>`;
            if (policyOpenedAt[p.id + ':v' + version]) return `<button data-action="markPolicyAsRead" data-policy-id="${escHtml(p.id)}" class="text-sm px-3 py-1 rounded-md bg-green-500 text-white">Mark as Read</button>`;
            return `<span class="text-xs text-gray-500">Open it first</span>`;
        }
        function notePolicyOpened(policyId) {
            const p = policyDocCache[policyId];
            if (!p) return;
            const key = p.id + ':v' + policyVersionOf(p);
            if (!policyOpenedAt[key]) policyOpenedAt[key] = new Date().toISOString();
            document.querySelectorAll('[data-policy-cta="' + policyId + '"]').forEach(el => {
                if (el.dataset.read !== '1') el.innerHTML = policyCtaHtml(p, undefined);
            });
        }
        // Links open as normal links; this only notes that the document was opened.
        document.addEventListener('click', e => {
            const a = e.target && e.target.closest ? e.target.closest('a[data-policy-open]') : null;
            if (a) notePolicyOpened(a.dataset.policyOpen);
        }, true);
        // A policy held as text (older entries) opens in a window instead of a link.
        function openPolicyDoc(target) {
            const p = policyDocCache[target.dataset.policyId];
            if (!p) return;
            const content = String(p.content || '');
            if (/^https?:\/\//i.test(content.trim())) window.open(content.trim(), '_blank');
            else showNotification(escHtml(content).replace(/\n/g, '<br>'), escHtml(p.title || 'Policy'));
            notePolicyOpened(p.id);
        }
        async function renderResourceLibraryScreen(screen) {
            try {
                const uid = gblCurrentUser.id;
                const role = gblCurrentUser.role;
                const [resourcesSnap, readConfirmsSnap, portalSnap] = await Promise.all([
                    getDocs(collection(db, "policyResources")),
                    getDocs(query(collection(db, "readConfirmations"), where("volunteerId", "==", uid))),
                    // Staff may also have read a policy in the portal.
                    getDocs(query(collection(db, "policy_tracking"), where("userId", "==", uid))).catch(() => null)
                ]);
                const myReads = {}; // policyId -> highest version read
                const addRead = d => {
                    if (!d || !d.policyId) return;
                    const v = policyVersionOf(d);
                    if (myReads[d.policyId] === undefined || v > myReads[d.policyId]) myReads[d.policyId] = v;
                };
                readConfirmsSnap.forEach(s => addRead(s.data()));
                if (portalSnap) portalSnap.forEach(s => addRead(s.data()));
                const policies = resourcesSnap.docs.map(d => ({ id: d.id, ...d.data() }))
                    .filter(p => policyVisibleTo(p, role))
                    .sort((a, b) => String(a.title || '').localeCompare(String(b.title || ''), 'en-GB'));
                policyDocCache = {};
                policies.forEach(p => { policyDocCache[p.id] = p; });
                const totalPolicies = policies.length;
                const readPolicies = policies.filter(p => policyReadCounts(myReads[p.id], p)).length;
                const percentageRead = totalPolicies > 0 ? Math.min(100, Math.round((readPolicies / totalPolicies) * 100)) : 100;
                const progressBarHtml = `

                         <p class="text-xs text-gray-500 mt-1 text-center">${escHtml(readPolicies)} of ${escHtml(totalPolicies)} documents read. Open each one, then mark it as read.</p>
                    </div>
                `;
                const resourcesHtml = policies.map(p => {
                    const version = policyVersionOf(p);
                    const isRead = policyReadCounts(myReads[p.id], p);
                    const readAgain = !isRead && myReads[p.id] !== undefined;
                    const content = String(p.content || '').trim();
                    const isUrl = /^https?:\/\//i.test(content);
                    const titleHtml = escHtml(p.title || 'Untitled policy');
                    const titleElement = isUrl
                        ? `<a href="${escHtml(content)}" target="_blank" rel="noopener" data-policy-open="${escHtml(p.id)}" class="font-bold hover:underline">${titleHtml}</a>`
                        : `<span data-action="openPolicyDoc" data-policy-id="${escHtml(p.id)}" class="font-bold cursor-pointer hover:underline">${titleHtml}</span>`;
                    const day = policyDayText(p.updatedAt || p.createdAt);
                    const info = [POLICY_AUDIENCE_LABEL[policyAudienceOf(p)], 'Version ' + version, day].filter(Boolean).join(' · ');
                    return `<div class="bg-white p-4 rounded-lg shadow flex justify-between items-center">
                        <div>
                            ${titleElement}
                            <p class="text-sm text-gray-500">${escHtml(info)}</p>
                            ${readAgain ? `<p class="text-xs font-bold mt-1" style="color:#b45309">New version: please read again</p>` : ''}
                        </div>
                        <div data-policy-cta="${escHtml(p.id)}" data-read="${escHtml(isRead ? '1' : '0')}" class="ml-2 text-right">${policyCtaHtml(p, myReads[p.id])}</div>
                    </div>`;
                }).join('');
                screen.innerHTML = `<div class="p-4 space-y-3">${progressBarHtml}${resourcesHtml || '<p>No policies found.</p>'}</div>`;
                 lucide.createIcons();
            } catch (e) { console.error(e); screen.innerHTML = `<p class="p-4 text-red-500">Could not load resources.</p>`; }
        }

        async function renderChatScreen(screen, context) {
            const { isGroup = false, recipientId, chatKey } = context;
            // Mark chat as read
            if (chatKey) {
                try {
                    const userRef = doc(db, "users", gblCurrentUser.id);
                    await updateDoc(userRef, {
                        [`chatLastRead.${chatKey}`]: Timestamp.now()
                    });
                    // Update local state to reflect change immediately
                     if (!gblCurrentUser.chatLastRead) gblCurrentUser.chatLastRead = {};
                     gblCurrentUser.chatLastRead[chatKey] = Timestamp.now();
                } catch(e) {
                    console.error("Failed to update last read timestamp", e);
                }
            }
            screen.innerHTML = `
                <div id="chatMessagesContainer" class="chat-message-container flex-grow overflow-y-auto">
                    <div class="spinner mx-auto"></div>
                </div>
                <div class="p-2 border-t bg-white flex items-center">
                     <input id="chatInput" type="text" enterkeyhint="send" aria-label="Message" placeholder="Type a message..." class="flex-grow p-2 border rounded-full focus:outline-none focus:ring-2 focus:ring-green-500">
                    <button data-action="sendMessage" data-context='${escHtml(JSON.stringify(context))}' aria-label="Send message" class="ml-2 bg-green-600 text-white p-3 rounded-full flex-shrink-0"><i data-lucide="send"></i></button>
                </div>
             `;
            lucide.createIcons();
            const messagesContainer = document.getElementById('chatMessagesContainer');
            let chatQuery;
            if (isGroup) {
                if (chatKey === 'admins') {
                    chatQuery = query(collection(db, "adminMessages"), orderBy("createdAt", "desc"), limit(50));
                } else if (chatKey === 'teachers') {
                    chatQuery = query(collection(db, "teacherMessages"), orderBy("createdAt", "desc"), limit(50));
                } else {
                    chatQuery = query(collection(db, "messages"), orderBy("createdAt", "desc"), limit(50));
                }
            } else {
                chatQuery = query(collection(db, "directMessages", chatKey, "messages"), orderBy("createdAt", "desc"), limit(50));
            }
            const userCache = {}; // one look-up per sender for as long as this chat is open
            chatUnsubscribe = onSnapshot(chatQuery, async (snapshot) => {
                const messagesHtmlPromises = snapshot.docs.reverse().map(async msgDoc => {
                    const msg = msgDoc.data();
                    const isSent = msg.senderId === gblCurrentUser.id;
                    
                     if (!isSent && !userCache[msg.senderId]) {
                        const userDoc = await getPersonDoc(msg.senderId).catch(() => null);
                        userCache[msg.senderId] = userDoc && userDoc.exists() ? userDoc.data() : { name: 'Unknown' };
                     }
                    const sender = userCache[msg.senderId];
                    return `<div class="chat-message ${escHtml(isSent ? 'sent' : 'received')}">
                               ${!isSent && isGroup ? `<p class="text-xs font-bold mb-1 text-green-700">${escHtml(sender.name)}</p>` : ''}
                                <p>${escHtml(msg.text)}</p>
                                 <p class="text-xs opacity-70 mt-1 text-right">${msg.createdAt ? new Date(msg.createdAt.seconds * 1000).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit', timeZone: 'Europe/London' }) : ''}</p>
                            </div>`;
                });
                messagesContainer.innerHTML = (await Promise.all(messagesHtmlPromises)).join('');
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }, error => {
                console.error("Chat listener error:", error);
                messagesContainer.innerHTML = `<p class="p-4 text-red-500">Error loading chat. Check Firestore rules and indexes.</p>`;
            });
        }

async function searchStudentsForCourse(courseId) {
    const queryText = document.getElementById("studentSearch").value.toLowerCase();
    const resultsDiv = document.getElementById("studentSearchResults");
    resultsDiv.innerHTML = "";
    if (!queryText || queryText.length < 2) {
        return;
    }
    try {
        const q = query(collection(db, "students"), where("name", ">=", queryText), where("name", "<=", queryText + "\uf8ff"));
        const snap = await getDocs(q);
        if (snap.empty) {
            resultsDiv.innerHTML = '<p class="text-sm text-gray-500">No matching students found.</p>';
            return;
        }
        const rosterSnap = await getDocs(query(collection(db, "courseRoster"), where("courseId", "==", courseId)));
        const alreadyEnrolled = new Set(rosterSnap.docs.map(d => d.data().studentId));
        resultsDiv.innerHTML = snap.docs.map(docSnap => {
            const student = { id: docSnap.id, ...docSnap.data() };
            if (alreadyEnrolled.has(student.id) || isArchivedData(student)) {
                return '';
            }
            return `<div class="flex justify-between items-center p-2 bg-white rounded shadow">
                        <span>${escHtml(student.name)}</span>
                        <button data-action="assignStudentToCourse" data-course-id="${escHtml(courseId)}" data-student-id="${escHtml(student.id)}" class="text-xs bg-green-500 text-white px-2 py-1 rounded">Assign</button>
                    </div>`;
        }).join('');
        lucide.createIcons();
    } catch (e) {
        console.error("Student search error:", e);
        resultsDiv.innerHTML = '<p class="text-sm text-red-500">Error searching students.</p>';
    }
}

        // --- Announcements (2026-09-24) ---
        // Posted from the portal (Announcements page) into the 'announcements'
        // collection, and shown at the top of both home screens here.
        function escHtml(v) {
            return String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        // ================= ANNOUNCEMENT RULES (30 Sep 2026) =================
        // Same rules as the portal (Intranet Portal/src/lib/announcements.ts):
        // severity 'info' | 'important' | 'urgent' (missing = info); audience 'staff' |
        // 'volunteers' | 'everyone' (missing = everyone); expiresAt 'YYYY-MM-DD' is the LAST
        // day shown (UK date; missing = always live). Volunteers see volunteers + everyone;
        // staff and admins see staff + everyone. The three newest live ones are shown.
        const ANNOUNCEMENT_STYLE = {
            info: { label: 'Information', bg: '#eff6ff', border: '#3b82f6', text: '#1e3a8a' },
            important: { label: 'Important', bg: '#fffbeb', border: '#f59e0b', text: '#78350f' },
            urgent: { label: 'Urgent', bg: '#fef2f2', border: '#ef4444', text: '#7f1d1d' },
        };
        function announcementSeverityOf(a) {
            const s = String((a && a.severity) || '').trim().toLowerCase();
            return s === 'important' || s === 'urgent' ? s : 'info';
        }
        function announcementIsLive(a, today) {
            const e = a && a.expiresAt;
            if (typeof e !== 'string' || !/^\d{4}-\d{2}-\d{2}$/.test(e)) return true;
            return (today || londonToday()) <= e;
        }
        function announcementVisibleTo(a, role) {
            const aud = policyAudienceOf(a);
            return aud === 'everyone' || audienceGroupOf(role) === aud;
        }
        // Firestore Timestamp -> '30 Sep 2026' in UK time.
        function announcementDate(ts) {
            let d = null;
            if (ts && typeof ts.toDate === 'function') d = ts.toDate();
            else if (ts && typeof ts.seconds === 'number') d = new Date(ts.seconds * 1000);
            if (!d || isNaN(d.getTime())) return '';
            return new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', day: 'numeric', month: 'short', year: 'numeric' }).format(d);
        }
        let announcementCache = {};
        let announcementLiveIds = [];
        function announcementRowHtml(id) {
            const a = announcementCache[id];
            if (!a) return '';
            const st = ANNOUNCEMENT_STYLE[announcementSeverityOf(a)];
            const date = announcementDate(a.createdAt);
            const text = String(a.content || '');
            const preview = text.length > 140 ? text.slice(0, 140).trim() + '…' : text;
            return `<div data-action="openAnnouncement" data-announcement-id="${escHtml(id)}" class="p-3 rounded-lg cursor-pointer" style="background:${escHtml(st.bg)};border:1px solid ${escHtml(st.border)};border-left-width:4px;color:${escHtml(st.text)}">
                        <p class="text-xs" style="color:${escHtml(st.text)}"><span class="font-bold">${escHtml(st.label)}</span>${date ? ' · ' + escHtml(date) : ''}</p>
                        <p class="text-sm font-bold mt-1">${escHtml(a.title)}</p>
                        <p class="text-xs mt-1">${escHtml(preview)}</p>
                    </div>`;
        }
        async function appendAnnouncements(screen) {
            try {
                const snap = await getDocs(query(collection(db, 'announcements'), orderBy('createdAt', 'desc'), limit(100))); // same as the portal
                if (!screen || !screen.isConnected) return;
                const today = londonToday();
                const role = gblCurrentUser && gblCurrentUser.role;
                announcementCache = {};
                announcementLiveIds = [];
                snap.docs.forEach(d => {
                    const a = d.data();
                    if (!announcementIsLive(a, today) || !announcementVisibleTo(a, role)) return;
                    announcementCache[d.id] = a;
                    announcementLiveIds.push(d.id);
                });
                if (announcementLiveIds.length === 0) return;
                const items = announcementLiveIds.slice(0, 3).map(announcementRowHtml).join('');
                const more = announcementLiveIds.length > 3
                    ? `<button data-action="showAllAnnouncements" type="button" class="text-xs font-bold text-blue-600 underline">See all (${escHtml(announcementLiveIds.length)})</button>`
                    : '';
                const box = document.createElement('div');
                box.className = 'px-4 pt-4';
                box.innerHTML = `<div class="space-y-2">
                    <p class="text-xs font-bold uppercase tracking-wider text-yellow-700 flex items-center"><i data-lucide="megaphone" class="w-4 h-4 mr-1"></i>Announcements</p>
                    ${items}${more}</div>`;
                screen.insertBefore(box, screen.firstChild);
                if (window.lucide) lucide.createIcons();
            } catch (e) { console.warn('Announcements could not be loaded:', e); }
        }
        // Tapping an announcement opens the full text.
        function openAnnouncement(target) {
            const a = announcementCache[target.dataset.announcementId];
            if (!a) return;
            const st = ANNOUNCEMENT_STYLE[announcementSeverityOf(a)];
            const date = announcementDate(a.createdAt);
            const meta = [st.label, date ? 'Posted ' + date : '', a.expiresAt ? 'Shown until ' + ukLongDate(a.expiresAt) : ''].filter(Boolean).join(' · ');
            const body = `<span class="text-xs font-bold" style="color:${escHtml(st.text)}">${escHtml(meta)}</span><br><br>${escHtml(a.content).replace(/\n/g, '<br>')}`;
            showNotification(body, escHtml(a.title));
        }

                <div class="flex justify-end mt-4"><button data-action="closeModal" class="px-4 py-2 bg-gray-300 text-gray-800 rounded-lg">Close</button></div>
            </div>`;
            modal.classList.remove('hidden');
        }
        function withAnnouncements(render) {

             try {
                 // Same maths as the portal Policy Hub: only people who must read a policy count,
                 // each person once per policy, only reads of the current version, and only
                 // policies that still exist, so no figure can pass 100%.
                 const [policiesSnap, confirmsSnap, usersSnap, portalSnap] = await Promise.all([
                      getDocs(collection(db, "policyResources")),
                      getDocs(collection(db, "readConfirmations")).catch(e => { console.warn('[policy stats] app reads not readable', e); return { forEach() {} }; }),
                      getDocs(collection(db, "users")),
                      getDocs(collection(db, "policy_tracking")).catch(e => { console.warn('[policy stats] portal reads not readable', e); return null; })
                 ]);
                 const policies = policiesSnap.docs.map(d => ({ id: d.id, ...d.data() }));
                 const reads = {}; // personId -> policyId -> highest version read
                 const addRead = (personId, d) => {
                     if (!personId || !d || !d.policyId) return;
                     const v = policyVersionOf(d);
                     if (!reads[personId]) reads[personId] = {};
                     if (reads[personId][d.policyId] === undefined || v > reads[personId][d.policyId]) reads[personId][d.policyId] = v;
                 };
                 confirmsSnap.forEach(s => { const d = s.data(); addRead(d.volunteerId, d); });
                 if (portalSnap) portalSnap.forEach(s => { const d = s.data(); addRead(d.userId, d); });

                     .sort((a, b) => a.name.localeCompare(b.name, 'en-GB'));
                 const totals = { staff: { read: 0, total: 0 }, volunteers: { read: 0, total: 0 } };
                 const perPerson = people.map(p => {
                     const required = policies.filter(pol => mustReadPolicy(pol, p.role));
                     const done = required.filter(pol => policyReadCounts((reads[p.id] || {})[pol.id], pol)).length;
                     totals[p.group].read += done;
                     totals[p.group].total += required.length;
                     return { ...p, done, required: required.length };
                 });
                 const perPolicy = policies.map(pol => {
                     const who = people.filter(p => mustReadPolicy(pol, p.role));

                                const els = [...container.querySelectorAll('tr:not(.dragging)')];
                                let closest = { offset: Number.NEGATIVE_INFINITY, el: null };
                                els.forEach(el => {
                                    const box = el.getBoundingClientRect();
                                    const offset = y - box.top - box.height / 2;
                                    if (offset < 0 && offset > closest.offset) closest = { offset, el };

                                return closest.el;

                            else tbody.insertBefore(dragging, after);

        async function handleStudentImport(file) {
            if (!file) return;
            const startImportBtn = document.getElementById('startImportBtn');
            startImportBtn.disabled = true;
            // Use a smaller spinner for the button
            startImportBtn.innerHTML = '<div class="spinner mx-auto" style="width: 20px; height: 20px; border-width: 2px;"></div>';
            const reader = new FileReader();
            reader.onload = async (e) => {
                try {
                    const data = new Uint8Array(e.target.result);
                    await loadScriptOnce('vendor/xlsx.full.min.js');
                    const workbook = XLSX.read(data, { type: 'array' });
                    const sheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    const json = XLSX.utils.sheet_to_json(worksheet);
                    if (json.length === 0) {
                        showNotification("The spreadsheet is empty or could not be read.", "Error");
                        return;
                    }

                    const batch = writeBatch(db);
                    let importedCount = 0;

                    json.forEach(row => {
                        // Basic validation: Name and Age are required.
                        if (!row['Name'] || !row['Age']) {
                            console.warn("Skipping row due to missing Name or Age:", row);
                            return; // Skip this row
                        }

                        const age = Number(row['Age']);
                
                        const studentData = {
                            name: row['Name'],
                            age: age,
                            email: row['Email'] || '',
                            ethnicity: row['Ethnicity'] || '',
                            nationality: row['Nationality'] || '',
                            postcode: row['Postcode'] || '',
                             reason: row['Reason for Joining'] || '',
                            createdAt: Timestamp.now(),
                        };

                     
                        // Add fields for minors if age is under 18
                        if (age < 18) {
                            studentData.parentName = row['Parent/Guardian Name'] || '';
                            studentData.parentPhone = row['Parent/Guardian Phone'] || '';
                            studentData.emergencyContact = row['Emergency Contact'] || '';
                            studentData.gpName = row['GP Name & Address'] || '';
                            studentData.allergies = row['Allergies/Medical Conditions'] || '';
                            // Handle boolean conversion for photo consent (e.g., 'Yes'/'No' to true/false)
                            const consent = String(row['Photo Consent']).trim().toLowerCase();
                            studentData.photoConsent = consent === 'yes' || consent === 'true';
                        }

                        const studentDocRef = doc(collection(db, "students"));
                        batch.set(studentDocRef, withoutStudentPrivate(studentData));
                        const privData = pickStudentPrivate(studentData);
                        if (Object.keys(privData).length) {
                            privData.updatedAt = Timestamp.now();
                            batch.set(doc(db, 'studentsPrivate', studentDocRef.id), privData, { merge: true });
                        }
                        importedCount++;
                    });

                    await batch.commit();
                    actions.closeModal();
                    showNotification(`${importedCount} of ${json.length} students were successfully imported!`, "Import Complete");
                    // Refresh student list if on that screen
                    if (currentScreen === 'adminUsersScreen' && gblCurrentContext.role === 'student') {
                        renderAdminUsersScreen(document.getElementById('adminUsersScreen'), { role: 'student', isSuperAdmin: true });
                    }

                } catch (error) {
                    console.error("Error during import:", error);
                    showNotification(`An error occurred during the import process: ${escHtml(error.message)}`, "Import Failed");
                } finally {
                    // This block runs whether the import succeeded or failed.
                    // The modal is closed on success, but if it's still open on error, reset the button.
                    const importBtn = document.getElementById('startImportBtn');
                    if (importBtn) {
                        importBtn.disabled = false;
                        importBtn.innerHTML = 'Import';
                    }
                }
            };
            reader.readAsArrayBuffer(file);
        }

        // Only the changes are written: rows are deleted for people who were unticked, added for
        // people newly ticked (with enrolledAt / assignedAt), and existing rows are left alone,
        // so enrolment dates are kept. People not shown in the checklists (archived people,
        // non-volunteer teachers assigned in the portal) are never touched.
        async function saveCourseAssignments(target) {
            const container = target.closest('[data-course-id]');
            const courseId = container.dataset.courseId;
            const volunteerBoxes = [...container.querySelectorAll('#assignVolunteersChecklist input[type="checkbox"]')];
            const studentBoxes = [...container.querySelectorAll('#enrollStudentsChecklist input[type="checkbox"]')];
            try {
                const [existingAssignments, existingRoster] = await Promise.all([
                    getDocs(query(collection(db, "courseAssignments"), where("courseId", "==", courseId))),
                    getDocs(query(collection(db, "courseRoster"), where("courseId", "==", courseId)))
                ]);
                const nowIso = new Date().toISOString();
                const ops = [];
                const diff = (boxes, snap, field, coll, dateField) => {
                    const rowsBy = new Map();
                    snap.docs.forEach(d => {
                        const id = d.data()[field];
                        if (!id) return;
                        if (!rowsBy.has(id)) rowsBy.set(id, []);
                        rowsBy.get(id).push(d);
                    });
                    const done = new Set();
                    boxes.forEach(b => {
                        if (done.has(b.value)) return;
                        done.add(b.value);
                        const rows = rowsBy.get(b.value) || [];
                        if (b.checked && rows.length === 0) {
                            ops.push(batch => batch.set(doc(collection(db, coll)), { courseId, [field]: b.value, [dateField]: nowIso }));
                        } else if (!b.checked && rows.length) {
                            rows.forEach(r => ops.push(batch => batch.delete(r.ref)));
                        }
                    });
                };
                diff(volunteerBoxes, existingAssignments, 'volunteerId', 'courseAssignments', 'assignedAt');
                diff(studentBoxes, existingRoster, 'studentId', 'courseRoster', 'enrolledAt');
                for (let i = 0; i < ops.length; i += 450) {
                    const batch = writeBatch(db);
                    ops.slice(i, i + 450).forEach(op => op(batch));
                    await batch.commit();
                }
                showNotification(ops.length ? "Course updated successfully!" : "Nothing has changed.", "Success");
                goBack();
            } catch (e) { console.error(e); showNotification("Failed to update course.", "Error"); }
        }
        // Saves today's register (UK date). The first save creates it; later saves the same day
        // are a diff: newly ticked people get a record, unticked people lose ALL their records
        // for this course and date. Nobody ticked = one "class held, nobody came" marker.
        // The database only allows changes on the class date (super admin: any date).
        async function takeAttendance(target) {
            const form = target && target.closest ? target.closest('form') : null;
            if (!form) return;
            const courseId = form.dataset.courseId;
            const isPastEdit = form.dataset.past === '1' && gblCurrentUser.role === 'super_admin';
            const todayStr = isPastEdit ? form.dataset.date : londonToday();
            const screenEl = document.getElementById('attendanceScreen');
            if (!isPastEdit && form.dataset.date && form.dataset.date !== todayStr) {
                // The screen was left open past midnight: reload it for the new day.
                showNotification("This register was opened on an earlier day, so it has been reloaded for today. Please tick it again.", "Register reloaded");
                renderAttendanceScreen(screenEl, { courseId });
                return;
            }
            const boxes = [...form.querySelectorAll('input[name="attendance"]')];
            const ticked = boxes.filter(b => b.checked);
            let existing;
            try {
                const snap = await getDocs(query(collection(db, "attendanceRecords"), where("courseId", "==", courseId), where("date", "==", todayStr)));
                existing = snap.docs.filter(d => d.data().date === todayStr);
            } catch (e) { console.error(e); showNotification("Could not read today's register. Please try again.", "Error"); return; }

            const keyOf = (type, id) => (type === 'volunteer' ? 'u:' : 's:') + id;
            const byPerson = new Map();
            const markers = [];
            existing.forEach(d => {
                const r = d.data();
                const k = r.userId ? keyOf('volunteer', r.userId) : (r.studentId ? keyOf('student', r.studentId) : null);
                if (!k) { markers.push(d); return; }
                if (!byPerson.has(k)) byPerson.set(k, []);
                byPerson.get(k).push(d);
            });
            const isEdit = existing.length > 0;

            const save = async () => {
                const batch = writeBatch(db);
                let adds = 0, removed = 0;
                const done = new Set();
                boxes.forEach(b => {
                    const k = keyOf(b.dataset.type, b.value);
                    if (done.has(k)) return;
                    done.add(k);
                    const rows = byPerson.get(k) || [];
                    if (b.checked && rows.length === 0) {
                        const record = { courseId, date: todayStr, timestamp: Timestamp.now() };
                        if (b.dataset.type === 'volunteer') record.userId = b.value; else record.studentId = b.value;
                        batch.set(doc(collection(db, "attendanceRecords")), record);
                        adds++;
                    } else if (!b.checked && rows.length) {
                        rows.forEach(r => batch.delete(r.ref));
                        removed += rows.length;
                        byPerson.delete(k);
                    }
                });
                const peopleLeft = [...byPerson.values()].reduce((t, rows) => t + rows.length, 0) + adds;
                let markerChange = 0;
                if (peopleLeft > 0) {
                    // Someone came after all: the "nobody came" marker is no longer true.
                    markers.forEach(m => batch.delete(m.ref));
                    markerChange = markers.length;
                } else if (markers.length === 0) {
                    batch.set(doc(collection(db, "attendanceRecords")), { courseId, date: todayStr, held: true, markedBy: gblCurrentUser.id, timestamp: Timestamp.now() });
                    markerChange = 1;
                }
                if (adds + removed + markerChange === 0) {
                    showNotification("Nothing has changed.", "No changes");
                    return;
                }
                try {
                    // With no signal the write is kept on the phone and uploads later; commit() only
                    // finishes once the server has it, so after 4 seconds the teacher is told it is safe.
                    const committed = batch.commit();
                    const quick = await Promise.race([committed.then(() => 'server'), new Promise(r => setTimeout(() => r('phone'), 4000))]);
                    if (quick === 'phone') {
                        committed.catch(err => {
                            console.error('[offline] register upload refused', err);
                            showNotification("A register you saved with no signal could not be uploaded (it can only be changed on the day of the class). Please tell Franco.", "Register not uploaded");
                        });
                        showNotification("Saved on this phone. It uploads by itself when you have signal, even if you close the app. Please do not sign out until then.", "Saved");
                        renderAttendanceScreen(screenEl, isPastEdit ? { courseId, date: todayStr } : { courseId });
                        return;
                    }
                    showNotification(isPastEdit ? `The register for ${escHtml(ukLongDate(todayStr))} has been saved.` : (isEdit ? "Today's register has been updated." : "Attendance submitted!"), "Success");
                    renderAttendanceScreen(screenEl, isPastEdit ? { courseId, date: todayStr } : { courseId });
                } catch (e) {
                    console.error(e);
                    const denied = e && (e.code === 'permission-denied' || String(e.message || '').includes('permission'));
                    showNotification(denied ? "The register could not be saved. A register can only be changed on the day of the class." : "Failed to save attendance.", "Error");
                }
            };

            if (ticked.length === 0) {
                showConfirmation(isPastEdit ? `Nobody came to this class on ${escHtml(ukLongDate(todayStr))}?` : "Nobody came to this class?", save, "Yes, nobody came");
                return;
            }
            if (isPastEdit) {
                showConfirmation(`Save these changes to the register for <b>${escHtml(ukLongDate(todayStr))}</b>? The hours and badges worked out from it change too.`, save, "Save changes");
                return;
            }
            await save();
        }

        // --- Staff account creation (2026-09-24) ---
        // The login and the profile are created together by the createStaffAccount
        // Cloud Function. The old code used addDoc(), which gave the profile a RANDOM
        // id that never matched the person's login, so they could not sign in.
        const STAFF_EMAIL_RE = /^[^\s@]+@[^\s@.]+(\.[^\s@.]+)+$/;
        // Initials avatar in the format every profile already uses. Same rule as the
        // createStaffAccount Cloud Function: first letter of first + last name.
        function staffInitials(name) {
            const words = String(name || '').trim().split(/\s+/).filter(Boolean)
                .map(w => (w.match(/\p{L}/u) || [''])[0]).filter(Boolean);
            if (!words.length) return '?';
            return (words[0] + (words.length > 1 ? words[words.length - 1] : '')).toLocaleUpperCase('en-GB');
        }
        // A picture of a person's initials, made on the phone (no internet needed).
        function initialsImage(name, bg, fg) {
            const ini = escHtml(staffInitials(name || '') || '?');
            const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100"><rect width="100" height="100" fill="${bg || '#cffafe'}"/><text x="50" y="50" dy=".35em" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="40" font-weight="700" fill="${fg || '#0e7490'}">${ini}</text></svg>`;
            return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
        }
        function avatarSrc(url, name) { return isInitialsAvatar(url) ? initialsImage(name) : url; }
        const BADGE_FALLBACK_IMG = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64"><circle cx="32" cy="26" r="20" fill="#facc15" stroke="#ca8a04" stroke-width="3"/><path d="M20 42 14 60l12-6 6 8 4-18zM44 42l6 18-12-6-6 8-4-18z" fill="#16a34a"/><text x="32" y="32" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#713f12">★</text></svg>');
        function staffAvatarUrl(name) {
            return 'https://placehold.co/100x100/22d3ee/0e7490?text=' + encodeURIComponent(staffInitials(name));
        }
        // Only an initials placeholder is ever replaced. A real uploaded photo is left alone.
        function isInitialsAvatar(url) {
            return !url || /^https:\/\/placehold\.co\//.test(url);
        }
        function staffEmailProblem(value) {
            const v = String(value || '').trim();
            if (!v) return 'The email address is empty.';
            if (/^[+\d\s()-]+$/.test(v)) return 'That looks like a phone number. People sign in with an email address.';
            if (v.indexOf('@') === -1) return 'That email address has no @ in it.';
            if (/\s/.test(v)) return 'That email address has a space in it.';
            if (!STAFF_EMAIL_RE.test(v)) return 'That email address is missing the part after the dot, like .com or .co.uk.';
            return '';
        }
        function staffCallError(e) {
            const code = (e && e.code || '').replace('functions/', '');
            const msg = (e && e.message) || '';
            switch (code) {
                case 'already-exists': return msg || 'That person already has an account.';
                case 'failed-precondition': return msg;
                case 'invalid-argument': return msg || 'Something in the form is not valid.';
                case 'permission-denied': return msg || 'You do not have permission to do that.';
                case 'unauthenticated': return 'Your session has expired. Sign out and back in, then try again.';
                case 'unavailable': case 'deadline-exceeded': return 'No connection to the server. Check the internet and try again.';
                default: return msg || 'Something went wrong on the server.';
            }
        }

        // Weekly grid, 7:00 to 22:00 (same hours as the portal calendar). Shows this week's
        // classes: a course appears only if this week's class day is inside its start/end dates.
        function renderCalendarView(screen, courses) {
            const days = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
            const today = londonToday();
            const t = new Date(today + 'T12:00:00Z');
            const monday = new Date(t); monday.setUTCDate(t.getUTCDate() - ((t.getUTCDay() + 6) % 7));
            const weekDates = days.map((_, i) => { const d = new Date(monday); d.setUTCDate(monday.getUTCDate() + i); return d.toISOString().slice(0, 10); });
            const dayHeaderHtml = days.map((d, i) => `<div class="text-center font-medium${weekDates[i] === today ? ' text-green-700 font-bold' : ''}">${escHtml(d)}<div class="text-[10px] text-gray-500">${escHtml(weekDates[i].slice(8, 10) + '/' + weekDates[i].slice(5, 7))}</div></div>`).join('');
            const FIRST_HOUR = 7, LAST_HOUR = 22;
            let eventsHtml = '';
            courses.forEach(course => {
                if (!course.schedule || !course.schedule.day || !course.schedule.start || !course.schedule.end) return;
                const dayIndex = days.findIndex(d => d.toLowerCase() === dayKey(course.schedule.day));
                if (dayIndex === -1) return;
                const classDate = weekDates[dayIndex];
                if (course.startDate && String(course.startDate).slice(0, 10) > classDate) return;
                if (course.endDate && String(course.endDate).slice(0, 10) < classDate) return;
                const [startHour, startMinute] = course.schedule.start.split(':').map(Number);
                const [endHour, endMinute] = course.schedule.end.split(':').map(Number);
                const rowStart = Math.max(1, (startHour - FIRST_HOUR) * 2 + Math.floor((startMinute || 0) / 30) + 1);
                const rowEnd = Math.min((LAST_HOUR - FIRST_HOUR) * 2 + 1, (endHour - FIRST_HOUR) * 2 + Math.ceil((endMinute || 0) / 30) + 1);
                if (rowEnd <= rowStart) return;
                const colStart = dayIndex + 2;
                
                eventsHtml += `
                    <div class="calendar-event" 
                         style="--start: ${escHtml(rowStart)}; --end: ${escHtml(rowEnd)}; --col: ${escHtml(colStart)};"
                         data-action="navigateTo"
                         data-screen-id="courseDetailScreen"
                         data-screen-title="Course Details"
                         data-context='${escHtml(JSON.stringify({ courseId: course.id }))}'>
                         <strong>${escHtml(course.name)}</strong>
                        <p class="text-xs">${escHtml(course.schedule.start)} - ${escHtml(course.schedule.end)}</p>
                    </div>`;
            });
            screen.innerHTML = `
                <div class="calendar-container">
                    <div class="calendar-header">
                        <div class="w-12"></div>
                        ${dayHeaderHtml}
                     </div>
                    <div class="calendar-scroll-container">
                        <div class="calendar-body" style="grid-template-rows: repeat(${(LAST_HOUR - FIRST_HOUR) * 2}, 20px);">
                            ${Array.from({length: LAST_HOUR - FIRST_HOUR}, (_, i) => `<div class="calendar-time-label" style="grid-row: ${i*2+1} / span 2">${FIRST_HOUR+i}:00</div>`).join('')}
                             ${eventsHtml || ''}
                        </div>
                        ${eventsHtml ? '' : '<p class="text-center text-sm text-gray-500 p-4">No classes this week.</p>'}
                    </div>
                </div>
             `;
            lucide.createIcons();
        }

                    return [
                         sanitize(v.name), sanitize(v.email), sanitize(v.phone), sanitize(v.profession),
                        sanitize(v.dbsCheck), sanitize(v.age), sanitize(v.ethnicity)
                    ].join('\t');
                }).join('\n');
                const volunteerTsv = volunteerHeaders.join('\t') + '\n' + volunteerData;
